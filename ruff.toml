target-version = "py312"
line-length = 110

[lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = [
  "S608",  # SQL is built only from constant column lists; values are always bound params
  "S603",  # subprocess: fixed ffmpeg/ffprobe argv lists, never a shell
  "S607",  # ffmpeg/ffprobe resolved from PATH inside the container image
]

[lint.per-file-ignores]
"**/tests/**" = ["S101"]

[lint.isort]
known-first-party = ["mytube_api", "mytube_worker", "handler"]
