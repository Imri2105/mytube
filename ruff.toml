target-version = "py312"
line-length = 110

[lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S608"]  # SQL is built only from constant column lists; values are always bound params

[lint.per-file-ignores]
"**/tests/**" = ["S101"]

[lint.isort]
known-first-party = ["mytube_api", "handler"]
